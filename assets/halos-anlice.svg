<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360">
  <defs>
    <radialGradient id="halo">
      <stop stop-color="#78ade0" stop-opacity=".53"/>
      <stop offset="1" stop-color="#bfd9f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lit-core">
      <stop stop-color="#ffffff"/>
      <stop offset=".68" stop-color="#d9efff"/>
      <stop offset="1" stop-color="#8ebde7" stop-opacity=".15"/>
    </radialGradient>
    <g id="bulb" stroke="#659ac7" stroke-width="7" stroke-linecap="round">
      <path fill="url(#lit-core)" d="M52 7C23 7 3 28 3 55c0 19 10 31 21 41 7 7 9 13 10 21h36c1-8 3-14 10-21 11-10 21-22 21-41C101 28 81 7 52 7zM38 129h28m-23 12h18"/>
    </g>
  </defs>
  <style>
    .light { animation: glow 12s ease-in-out infinite; }
    .later { animation-delay: -6s; }
    .faint { animation-delay: -5s; }
    @keyframes glow { 0%, 12%, 100% { opacity: .18; } 39%, 65% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .light { animation: none; } }
  </style>
  <g class="light" opacity=".5">
    <ellipse cx="78" cy="79" rx="75" ry="72" fill="url(#halo)"/>
    <ellipse cx="382" cy="264" rx="82" ry="78" fill="url(#halo)"/>
    <use href="#bulb" transform="translate(375 254) scale(.19)"/>
  </g>
  <g class="light later" opacity=".5">
    <ellipse cx="319" cy="91" rx="84" ry="79" fill="url(#halo)"/>
    <use href="#bulb" transform="translate(312 81) scale(.19)"/>
  </g>
  <g class="light faint" opacity=".5">
    <ellipse cx="146" cy="265" rx="90" ry="83" fill="url(#halo)"/>
  </g>
</svg>
